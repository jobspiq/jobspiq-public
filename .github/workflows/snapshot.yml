name: Monthly data snapshot

on:
  schedule:
    - cron: "30 3 1 * *"   # 03:30 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the live datasets into a dated folder
        run: |
          DAY=$(date -u +%F)
          mkdir -p "data/$DAY"
          for f in skills-demand-india.csv tech-salaries-stated-india.csv; do
            curl -sSf --retry 3 -o "data/$DAY/$f" "https://jobspiq.in/data/$f"
          done

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: snapshot $(date -u +%F)"
          git push
